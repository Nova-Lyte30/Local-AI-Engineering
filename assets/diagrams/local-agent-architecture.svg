<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="local-agent-architecture-title local-agent-architecture-desc" id="local-agent-architecture-root">
      <title id="local-agent-architecture-title">本地 AI Agent 工作流架构</title>
      <desc id="local-agent-architecture-desc">用户任务进入 Cline Desktop，经本机 API 调用 llama-server 和已加载的 GGUF 模型；工具请求在审批分支后执行，并将工作区结果送回客户端。</desc>
      <defs>
      <style>
      #local-agent-architecture-root { color: #2d3142; font-family: Geist, 'Noto Sans TC', system-ui, sans-serif; }
      #local-agent-architecture-root .lede { max-width: 820px; margin: 0 0 24px; color: #4f5d75; font-size: 14px; line-height: 1.6; }
      #local-agent-architecture-root .diagram-container { width: 100%; overflow-x: auto; border-top: 1px solid #bfc0c0; border-bottom: 1px solid #bfc0c0; }
      #local-agent-architecture-root .node-name { fill: #2d3142; font: 600 15px Geist, 'Noto Sans TC', sans-serif; text-anchor: middle; }
      #local-agent-architecture-root .node-note { fill: #5a6580; font: 400 10px 'Geist Mono', 'Noto Sans TC', monospace; text-anchor: middle; }
      #local-agent-architecture-root .tag { fill: #5a6580; font: 500 8px 'Geist Mono', monospace; letter-spacing: .1em; text-anchor: middle; }
      #local-agent-architecture-root .edge { fill: none; stroke: #4f5d75; stroke-width: 1.7; marker-end: url(#local-agent-architecture-arrow); }
      #local-agent-architecture-root .edge-api { fill: none; stroke: #2e5aa8; stroke-width: 2; marker-end: url(#local-agent-architecture-arrow-link); }
      #local-agent-architecture-root .edge-accent { fill: none; stroke: #bf4520; stroke-width: 2; marker-end: url(#local-agent-architecture-arrow-accent); }
      #local-agent-architecture-root .edge-return { fill: none; stroke: #4f5d75; stroke-width: 1.7; stroke-dasharray: 5 4; marker-end: url(#local-agent-architecture-arrow); }
      #local-agent-architecture-root .edge-label { fill: #5a6580; font: 500 10px Geist, 'Noto Sans TC', sans-serif; text-anchor: middle; }
      #local-agent-architecture-root .section { fill: #5a6580; font: 500 10px 'Geist Mono', 'Noto Sans TC', monospace; letter-spacing: .08em; }
      #local-agent-architecture-root .note { margin: 14px 0 0; color: #5a6580; font-size: 12px; line-height: 1.6; }
      @media print {
#local-agent-architecture-root .diagram-container { overflow-x: visible; }
}</style>
        <marker id="local-agent-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="local-agent-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
        <marker id="local-agent-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#f5f5f5"/>
      <text x="64" y="44" class="section">01 / 本地推理链路</text>
      <text x="64" y="268" class="section">02 / 工具决策与执行</text>
      <line x1="64" y1="252" x2="1216" y2="252" stroke="#bfc0c0" stroke-width="1"/>

      <!-- Connectors precede nodes. Separate routes retain the source's distinct branches. -->
      <path class="edge" d="M204 140 H280"/>
      <path class="edge-api" d="M460 132 H608"/>
      <path class="edge" d="M780 132 H920"/>
      <path class="edge-return" d="M920 156 H780"/>
      <path class="edge-return" d="M656 172 V216 Q656 224 648 224 H524 M500 224 H416 Q408 224 408 216 V172"/>
      <path class="edge" d="M344 172 V292"/>
      <path class="edge" d="M260 340 H188 Q180 340 180 348 V560"/>
      <path class="edge-accent" d="M420 340 H520"/>
      <path class="edge" d="M680 340 H780"/>
      <path class="edge" d="M860 292 V284 Q860 276 868 276 H1192 Q1200 276 1200 284 V652 Q1200 660 1192 660 H120 Q112 660 112 652 V620"/>
      <path class="edge-accent" d="M940 340 H1052 Q1060 340 1060 348 V456"/>
      <path class="edge" d="M636 388 V468 Q636 476 644 476 H960"/>
      <path class="edge" d="M1012 516 V580 Q1012 588 1004 588 H896"/>
      <path class="edge-return" d="M736 596 H512 Q504 596 504 588 V236 Q504 232 512 228 Q520 224 512 220 Q504 216 504 212 V200 Q504 192 496 192 H448 Q440 192 440 184 V172"/>
      <path class="edge" d="M316 112 V72 Q316 64 308 64 H48 Q40 64 40 72 V588 Q40 596 48 596 H64"/>

      <!-- Edge labels sit clear of their strokes and nodes. -->
      <rect x="488" y="112" width="92" height="12" rx="2" fill="#f5f5f5"/><text x="534" y="122" class="edge-label">本机 API 请求</text>
      <rect x="536" y="204" width="108" height="12" rx="2" fill="#f5f5f5"/><text x="590" y="214" class="edge-label">文本或工具请求</text>
      <rect x="214" y="320" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="226" y="330" class="edge-label">否</text>
      <rect x="456" y="320" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="468" y="330" class="edge-label">是</text>
      <rect x="718" y="320" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="730" y="330" class="edge-label">是</text>
      <rect x="1168" y="394" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="1180" y="404" class="edge-label">否</text>
      <rect x="980" y="320" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="992" y="330" class="edge-label">是</text>
      <rect x="784" y="456" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="796" y="466" class="edge-label">否</text>
      <rect x="568" y="576" width="84" height="12" rx="2" fill="#f5f5f5"/><text x="610" y="586" class="edge-label">工具结果返回</text>

      <!-- Inference lane -->
      <rect x="64" y="112" width="140" height="56" rx="20" fill="#f5f5f5" stroke="#4f5d75"/>
      <text x="134" y="145" class="node-name">用户任务</text>
      <rect x="280" y="112" width="180" height="60" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="1.8"/>
      <rect x="290" y="120" width="40" height="14" rx="2" fill="#f5f5f5" stroke="#bf4520"/><text x="310" y="130" class="tag">CLIENT</text>
      <text x="370" y="151" class="node-name">Cline Desktop</text>
      <rect x="608" y="112" width="172" height="60" rx="6" fill="#f5f5f5" stroke="#2e5aa8"/>
      <rect x="618" y="120" width="28" height="14" rx="2" fill="#f5f5f5" stroke="#2e5aa8"/><text x="632" y="130" class="tag">API</text>
      <text x="694" y="151" class="node-name">llama-server</text>
      <rect x="920" y="112" width="220" height="60" rx="6" fill="#ececec" stroke="#4f5d75"/>
      <rect x="930" y="120" width="36" height="14" rx="2" fill="#ececec" stroke="#4f5d75"/><text x="948" y="130" class="tag">MODEL</text>
      <text x="1030" y="150" class="node-name">已加载的 GGUF 模型</text>

      <!-- Decision lane: diamonds carry the branching semantics. -->
      <polygon points="340,292 420,340 340,388 260,340" fill="#f5f5f5" stroke="#4f5d75"/>
      <text x="340" y="344" class="node-name">需要工具操作?</text>
      <polygon points="600,292 680,340 600,388 520,340" fill="#f5f5f5" stroke="#bf4520" stroke-width="1.8"/>
      <text x="600" y="338" class="node-name">客户端要求</text><text x="600" y="358" class="node-name">审批?</text>
      <polygon points="860,292 940,340 860,388 780,340" fill="#f5f5f5" stroke="#4f5d75"/>
      <text x="860" y="344" class="node-name">用户批准?</text>
      <rect x="960" y="456" width="160" height="60" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
      <text x="1040" y="491" class="node-name">执行本地工具</text>
      <rect x="736" y="560" width="160" height="60" rx="6" fill="#ececec" stroke="#4f5d75"/>
      <text x="816" y="588" class="node-name">隔离工作区</text><text x="816" y="606" class="node-note">按任务指定的目录</text>
      <rect x="64" y="560" width="160" height="60" rx="20" fill="#f5f5f5" stroke="#4f5d75"/>
      <text x="144" y="595" class="node-name">回复用户</text>

      <line x1="64" y1="684" x2="1216" y2="684" stroke="#bfc0c0"/>
      <text x="64" y="704" class="section">实线 · 前向流程</text>
      <text x="338" y="704" class="section">虚线 · 返回 / 双向交互</text>
      <text x="760" y="704" class="section">蓝色 · 本机 API</text>
      <text x="1010" y="704" class="section">橘色 · 决策重点</text>
    </svg>

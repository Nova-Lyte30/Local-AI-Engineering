<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="local-llm-runtime-architecture-title local-llm-runtime-architecture-desc" id="local-llm-runtime-architecture-root">
      <title id="local-llm-runtime-architecture-title">本地模型推理架构</title>
      <desc id="local-llm-runtime-architecture-desc">本机用户或客户端通过 127.0.0.1:8080/v1 连接 llama-server，后者连接本地 GGUF 模型，并使用 NVIDIA GPU 与系统内存。</desc>
      <defs>
      <style>
      #local-llm-runtime-architecture-root { color: #2d3142; font-family: Geist, 'Noto Sans TC', system-ui, sans-serif; }
      #local-llm-runtime-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #local-llm-runtime-architecture-root .node-name { fill: #2d3142; font: 600 16px Geist, 'Noto Sans TC', sans-serif; text-anchor: middle; }
      #local-llm-runtime-architecture-root .node-note { fill: #5a6580; font: 400 10px 'Geist Mono', 'Noto Sans TC', monospace; text-anchor: middle; }
      #local-llm-runtime-architecture-root .tag { fill: #5a6580; font: 500 8px 'Geist Mono', monospace; letter-spacing: .1em; text-anchor: middle; }
      #local-llm-runtime-architecture-root .arrow-label { fill: #2e5aa8; font: 500 11px 'Geist Mono', monospace; text-anchor: middle; }
      #local-llm-runtime-architecture-root .section { fill: #5a6580; font: 500 10px 'Geist Mono', 'Noto Sans TC', monospace; letter-spacing: .1em; }
      @media print {
#local-llm-runtime-architecture-root .diagram-container { overflow-x: visible; }
}</style>
        <marker id="local-llm-runtime-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="local-llm-runtime-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
        <marker id="local-llm-runtime-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect x="0" y="0" width="1280" height="720" fill="#f5f5f5"/>
      <text x="64" y="72" class="section">LOCAL INFERENCE / COMPONENT VIEW</text>
      <text x="64" y="112" fill="#2d3142" font-size="30" font-family="'Instrument Serif','Noto Sans TC',serif">本地模型推理架构</text>
      <line x1="64" y1="132" x2="1216" y2="132" stroke="#bfc0c0" stroke-width="1"/>

      <!-- Three relationships from the supplied source; connectors are drawn first. -->
      <path d="M320 364 H520" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#local-llm-runtime-architecture-arrow-link)"/>
      <path d="M750 340 H824 Q832 340 832 332 V252 Q832 244 840 244 H916" fill="none" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#local-llm-runtime-architecture-arrow)"/>
      <path d="M750 388 H840 Q848 388 848 396 V468 Q848 476 856 476 H916" fill="none" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#local-llm-runtime-architecture-arrow)"/>
      <rect x="356" y="332" width="128" height="24" rx="2" fill="#f5f5f5"/>
      <text x="420" y="342" class="arrow-label">127.0.0.1</text>
      <text x="420" y="353" class="arrow-label">:8080/v1</text>

      <!-- User/client -->
      <rect x="100" y="316" width="220" height="96" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.3"/>
      <rect x="112" y="328" width="48" height="16" rx="2" fill="#f5f5f5" stroke="#4f5d75" stroke-width=".8"/>
      <text x="136" y="339" class="tag">CLIENT</text>
      <text x="210" y="372" class="node-name">本机用户或客户端</text>
      <text x="210" y="392" class="node-note">LOCAL REQUEST</text>

      <!-- Local API server: the single focal component -->
      <rect x="520" y="316" width="230" height="96" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="2"/>
      <rect x="532" y="328" width="48" height="16" rx="2" fill="#f5f5f5" stroke="#bf4520" stroke-width=".8"/>
      <text x="556" y="339" class="tag">SERVER</text>
      <text x="635" y="372" class="node-name">llama-server</text>
      <text x="635" y="392" class="node-note">OPENAI-COMPATIBLE API</text>

      <!-- Model artifact -->
      <rect x="916" y="196" width="240" height="96" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1.3"/>
      <rect x="928" y="208" width="48" height="16" rx="2" fill="#ececec" stroke="#4f5d75" stroke-width=".8"/>
      <text x="952" y="219" class="tag">MODEL</text>
      <text x="1036" y="252" class="node-name">本地 GGUF 模型</text>
      <text x="1036" y="272" class="node-note">MODEL FILE</text>

      <!-- Compute resources -->
      <rect x="916" y="428" width="240" height="96" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.3"/>
      <rect x="928" y="440" width="48" height="16" rx="2" fill="#f5f5f5" stroke="#4f5d75" stroke-width=".8"/>
      <text x="952" y="451" class="tag">DEVICE</text>
      <text x="1036" y="484" class="node-name">NVIDIA GPU / 系统内存</text>
      <text x="1036" y="504" class="node-note">LOCAL COMPUTE</text>

      <line x1="64" y1="636" x2="1216" y2="636" stroke="#bfc0c0" stroke-width="1"/>
      <line x1="64" y1="666" x2="92" y2="666" stroke="#2e5aa8" stroke-width="2"/>
      <text x="104" y="670" class="section">本机 API 请求</text>
      <line x1="320" y1="666" x2="348" y2="666" stroke="#4f5d75" stroke-width="2"/>
      <text x="360" y="670" class="section">模型与计算资源关系</text>
    </svg>
